databaseChangeLog:
  - changeSet:
      id: 001-ticket-tables
      author: ticket-management
      changes:
        - createSequence:
            sequenceName: ticket_number_seq
            startValue: 1001
            incrementBy: 1
        - createTable:
            tableName: ticket
            columns:
              - column:
                  name: id
                  type: varchar(16)
                  constraints:
                    primaryKey: true
                    primaryKeyName: ticket_pkey
                    nullable: false
              - column:
                  name: title
                  type: varchar(500)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
                  defaultValue: ""
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: priority
                  type: varchar(16)
                  constraints:
                    nullable: false
              - column:
                  name: assignee
                  type: varchar(320)
              - column:
                  name: category
                  type: varchar(32)
              - column:
                  name: resolution_notes
                  type: text
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - createTable:
            tableName: ticket_comment
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: ticket_comment_pkey
                    nullable: false
              - column:
                  name: ticket_id
                  type: varchar(16)
                  constraints:
                    nullable: false
              - column:
                  name: body
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_ticket_comment_ticket
            baseTableName: ticket_comment
            baseColumnNames: ticket_id
            referencedTableName: ticket
            referencedColumnNames: id
            onDelete: CASCADE
